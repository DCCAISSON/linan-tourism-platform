name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Reconciliation scheduler tests
        run: node --experimental-vm-modules deploy/cloud-test/reconcile-wechat-bill.test.mjs

      - name: Build
        run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: linan_contract_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @linan/admin exec playwright install --with-deps chromium

      - name: API e2e
        run: pnpm --filter @linan/api test:e2e
        env:
          DOMAIN_TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/linan_contract_test

      - name: SMS transaction e2e in a separate empty database
        run: |
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -e "CREATE DATABASE linan_phone_auth_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
          trap 'docker exec "${{ job.services.mysql.id }}" mysql -uroot -e "DROP DATABASE linan_phone_auth_test"' EXIT
          pnpm --filter @linan/api exec vitest run --config ./vitest.config.e2e.ts test/phone-sms-transaction.e2e-spec.ts
        env:
          PHONE_AUTH_TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/linan_phone_auth_test

      - name: Admin e2e
        run: pnpm --filter @linan/admin test:e2e

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked security patches
        run: pnpm install --frozen-lockfile

      - name: Verify security patches and compatibility
        run: node --test scripts/dependency-security.test.mjs

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_VERSION: "8.30.1"
