# Historical HTTP/certificate bootstrap template, not the current complete deployment.
# Current deployments use nginx-miniapp-experience.conf; never enable both templates.
server {
    listen 80;
    server_name linantravel.cn www.linantravel.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/linan-acme;
    }

    root /opt/linan-test/app/apps/site/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name admin.linantravel.cn api.linantravel.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/linan-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
