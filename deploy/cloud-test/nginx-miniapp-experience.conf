# Current complete site template: HTTP/ACME, public site, protected admin, public API transport.
# API business routes still require application authentication; do not add Basic Auth here.
# Enable this template alone, not alongside nginx-http.conf or the legacy HTTPS template.
server {
    listen 80;
    server_name linantravel.cn www.linantravel.cn admin.linantravel.cn api.linantravel.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/linan-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name linantravel.cn www.linantravel.cn;
    ssl_certificate /etc/letsencrypt/live/linan-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linan-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/linan-test/app/apps/site/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name admin.linantravel.cn;
    ssl_certificate /etc/letsencrypt/live/linan-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linan-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Linan test environment";
    auth_basic_user_file /etc/nginx/linan-test.htpasswd;
    root /opt/linan-test/app/apps/admin/dist;
    index index.html;

    location = /api/configuration/catalog-covers {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3000/configuration/catalog-covers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.linantravel.cn;
    ssl_certificate /etc/letsencrypt/live/linan-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linan-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /configuration/catalog-covers {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
