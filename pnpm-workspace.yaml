packages:
  - apps/*
  - packages/*
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.1'
  - multer@2.4.0
overrides:
  'brace-expansion@1': 1.1.20
  'brace-expansion@2': 2.1.6
  'brace-expansion@5': 5.0.11
  '@intlify/core-base': 9.14.5
  '@intlify/message-resolver': 9.1.11
  adm-zip: 0.6.1
  jpeg-js: 0.4.4
  multer: 2.4.0
  postcss: 8.5.28
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  ws: 8.21.3
packageExtensions:
  '@dcloudio/uni-h5-vite@3.0.0-alpha-5020620260914001':
    dependencies:
      vite: 6.4.3
  '@dcloudio/uni-mp-vite@3.0.0-alpha-5020620260914001':
    dependencies:
      estree-walker: 2.0.2
patchedDependencies:
  '@vue/shared@3.4.21': patches/@vue__shared@3.4.21.patch
  '@vue/shared@3.5.22': patches/@vue__shared@3.5.22.patch
  braces@3.0.3: patches/braces@3.0.3.patch
audit:
  # Exact local patches require scripts/dependency-security.test.mjs to pass before audit.
  # These are not upstream fixed versions. Review/removal conditions: docs/依赖安全补丁说明.md.
  ignore:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-g2v6-rqmx-r4w6
